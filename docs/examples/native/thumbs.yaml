schema: ergogen/v1
meta:
  name: Irregular thumbs
units:
  pitch: 19
parts:
  mx:
    revision: "1"
    envelopes:
      pcb:
        size:
          - 18
          - 18
      plate:
        size:
          - 14
          - 14
      body:
        size:
          - 14
          - 14
        height:
          - 0
          - 11.6
    footprints:
      switch:
        what: mx
        params:
          from: "{{column_net}}"
          to: "{{row_net}}"
layout:
  layers:
    switches:
      surface: pcb.main.top
  clusters:
    fingers:
      layer: switches
      arrangement:
        type: columns
        columns:
          - outer
          - inner
        rows:
          - home
          - top
        pitch:
          - pitch
          - pitch
        stagger:
          inner: 3
    thumbs:
      layer: switches
      placement:
        at:
          - 25
          - -35
          - 0
        rotate: -15
      arrangement:
        type: arc
        radius: 45
        start: -15
        step: 30
  objects:
    outer_home:
      kind: key
      part: mx
      pcb: main
      cluster: fingers
      cell:
        - outer
        - home
      properties:
        column_net: outer
        row_net: home
    outer_top:
      kind: key
      part: mx
      pcb: main
      cluster: fingers
      cell:
        - outer
        - top
      properties:
        column_net: outer
        row_net: top
    inner_home:
      kind: key
      part: mx
      pcb: main
      cluster: fingers
      cell:
        - inner
        - home
      properties:
        column_net: inner
        row_net: home
    inner_top:
      kind: key
      part: mx
      pcb: main
      cluster: fingers
      cell:
        - inner
        - top
      properties:
        column_net: inner
        row_net: top
    thumb_0:
      kind: key
      part: mx
      pcb: main
      cluster: thumbs
      index: 0
      properties:
        column_net: thumb0
        row_net: thumb
    thumb_1:
      kind: key
      part: mx
      pcb: main
      cluster: thumbs
      index: 1
      properties:
        column_net: thumb1
        row_net: thumb
    thumb_2:
      kind: key
      part: mx
      pcb: main
      cluster: thumbs
      index: 2
      properties:
        column_net: thumb2
        row_net: thumb
designs:
  regions:
    keys:
      select:
        kind: key
        cluster: fingers
      envelope: pcb
      close: 2
    thumbs:
      select:
        cluster: thumbs
      envelope: pcb
      close: 3
  profiles:
    board:
      from: boundaries.body
  boundaries:
    body:
      from:
        - regions.keys
        - regions.thumbs
      bridges:
        neck:
          from:
            ref: inner_home
          to:
            ref: thumb_0
          width: 10
      clearance: 2
      connected: single
pcbs:
  main:
    profile: profiles.board
    thickness: 1.6
